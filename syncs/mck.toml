[[stack]]
name = "obs-studio-otel-signoz-mck"
tags = ["mck", "criticality: 1"]
[stack.config]
server = "mck"
project_name = "obs-studio-otel-signoz-mck"
linked_repo = "compose_main"
run_directory = "obs-studio-otel-signoz"
additional_env_files = ["/etc/komodo/domain.env"]
env_file_path = "/etc/komodo/env/obs-studio-otel-signoz-mck.env"
compose_cmd_wrapper = """
export INFISICAL_TOKEN=$(infisical login --domain="[[INFISICAL_URL]]" --method=universal-auth --client-id="[[INFISICAL_ID]]" --client-secret="[[INFISICAL_SECRET]]" --silent --plain) && \
infisical run --env=prod --path=/obs-studio-otel --domain=[[INFISICAL_URL]] --token=$INFISICAL_TOKEN --projectId=[[INFISICAL_WORKSPACE]] -- [[COMPOSE_COMMAND]]
"""

